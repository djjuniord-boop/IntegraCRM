name: Zbuduj IntegraCRM.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller reportlab

      - name: Tesseract OCR
        run: choco install tesseract -y --no-progress

      - name: Wersja
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app/version.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: PyInstaller
        run: pyinstaller --noconfirm --windowed --name IntegraCRM --collect-all pdfplumber --collect-all pdfminer --collect-submodules tkinter --collect-submodules PIL --collect-submodules email --collect-submodules urllib --collect-submodules json --collect-submodules encodings --collect-submodules ctypes --collect-all openpyxl --collect-all pypdf --collect-all matplotlib launcher.py

      - name: Paczka
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "pkg/IntegraCRM"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse dist/IntegraCRM/* $out
          Copy-Item -Recurse app $out/app
          Copy-Item -Recurse data $out/data
          Copy-Item Przywroc-poprzednia.bat, README.md $out
          $tess = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force $out/tesseract/tessdata | Out-Null
          Copy-Item "$tess\*.exe", "$tess\*.dll" $out/tesseract
          Copy-Item "$tess\tessdata\eng.traineddata", "$tess\tessdata\osd.traineddata" $out/tesseract/tessdata
          Get-ChildItem -Recurse -Directory -Filter __pycache__ $out | Remove-Item -Recurse -Force
          Compress-Archive -Path $out -DestinationPath "IntegraCRM-$v-exe.zip"
          python tools/publish.py
          Copy-Item release/* .

      - name: Test działania (ścieżka z polskimi znakami)
        shell: pwsh
        run: |
          $dir = "C:\Testy\Użytkownik Łódź\IntegraCRM"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse pkg/IntegraCRM/* $dir
          $fx = "C:\Testy\Użytkownik Łódź\dane"
          $env:PYTHONIOENCODING = "utf-8"
          python tools/make_fixtures.py $fx
          $env:TEMP = "C:\Testy\Użytkownik Łódź\temp"; $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          $env:INTEGRA_SELFTEST = $fx
          $p = Start-Process -FilePath "$dir\IntegraCRM.exe" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "Test: przekroczony czas" }
          Get-Content "$fx\result.json"
          $r = Get-Content "$fx\result.json" -Raw | ConvertFrom-Json
          if (-not $r.ok) { throw "Test nie przeszedł" }

      - name: Zrzuty ekranu (kontrola wyglądu)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:INTEGRA_SHOT = (Resolve-Path shots).Path
          $p = Start-Process -FilePath pkg/IntegraCRM/IntegraCRM.exe -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Host "timeout" }
          Get-ChildItem shots
          if (Test-Path shots/error.txt) { Get-Content shots/error.txt }
          if (Test-Path shots/dnd.txt) { Get-Content shots/dnd.txt }
          $log = "pkg/IntegraCRM/data/error.log"; if (Test-Path $log) { Get-Content $log }

      - uses: actions/upload-artifact@v4
        with:
          name: zrzuty
          path: shots/*

      - uses: actions/upload-artifact@v4
        with:
          name: IntegraCRM-${{ steps.ver.outputs.version }}
          path: |
            IntegraCRM-*-exe.zip
            integra-*.zip
            version.json

      - name: Wydanie (Releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" "IntegraCRM-$v-exe.zip" "integra-$v.zip" version.json --clobber
          } else {
            gh release create "v$v" "IntegraCRM-$v-exe.zip" "integra-$v.zip" version.json --title "IntegraCRM $v" --notes "Automatyczna kompilacja wersji $v"
          }
