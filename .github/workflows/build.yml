name: Zbuduj IntegraCRM.exe

on:
  push:
    branches: [main, beta]   # beta = kanał testowy (pre-release, nie trafia do zwykłych użytkowników)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller reportlab

      - name: Testy modułów (bez okna) i importy
        run: |
          python tests/check_imports.py
          python tests/run_tests.py

      - name: Tesseract OCR
        run: choco install tesseract -y --no-progress

      - name: Wersja
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path app/version.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: PyInstaller
        run: pyinstaller --noconfirm --windowed --name IntegraCRM --icon app/assets/icon.ico --collect-all pdfplumber --collect-all pdfminer --collect-submodules tkinter --collect-submodules PIL --collect-submodules email --collect-submodules urllib --collect-submodules json --collect-submodules encodings --collect-submodules ctypes --collect-all openpyxl --collect-all pypdf --collect-all matplotlib --collect-all webview --collect-all clr_loader --collect-all pythonnet launcher.py

      - name: Paczka
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $out = "pkg/IntegraCRM"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item -Recurse dist/IntegraCRM/* $out
          Copy-Item -Recurse app $out/app
          Copy-Item -Recurse data $out/data
          Copy-Item Przywroc-poprzednia.bat, README.md $out
          $tess = "C:\Program Files\Tesseract-OCR"
          New-Item -ItemType Directory -Force $out/tesseract/tessdata | Out-Null
          Copy-Item "$tess\*.exe", "$tess\*.dll" $out/tesseract
          Copy-Item "$tess\tessdata\eng.traineddata", "$tess\tessdata\osd.traineddata" $out/tesseract/tessdata
          Get-ChildItem -Recurse -Directory -Filter __pycache__ $out | Remove-Item -Recurse -Force
          Compress-Archive -Path $out -DestinationPath "IntegraCRM-$v-exe.zip"
          python tools/publish.py
          Copy-Item release/* .

      - name: Test działania (ścieżka z polskimi znakami)
        shell: pwsh
        run: |
          $dir = "C:\Testy\Użytkownik Łódź\IntegraCRM"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse pkg/IntegraCRM/* $dir
          $fx = "C:\Testy\Użytkownik Łódź\dane"
          $env:PYTHONIOENCODING = "utf-8"
          python tools/make_fixtures.py $fx
          $env:TEMP = "C:\Testy\Użytkownik Łódź\temp"; $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force $env:TEMP | Out-Null
          $env:INTEGRA_SELFTEST = $fx
          $p = Start-Process -FilePath "$dir\IntegraCRM.exe" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "Test: przekroczony czas" }
          Get-Content "$fx\result.json"
          $r = Get-Content "$fx\result.json" -Raw | ConvertFrom-Json
          if (-not $r.ok) { throw "Test nie przeszedł" }
          Remove-Item -Recurse -Force "$dir" -ErrorAction SilentlyContinue

      - name: Test okna SERWIS QR (WebView2, zapis danych między uruchomieniami)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $exe = (Resolve-Path pkg/IntegraCRM/IntegraCRM.exe).Path
          $data = "pkg/IntegraCRM/data"
          function Show-Logs { foreach ($f in "$data/serwis.log", "$data/error.log", "$data/serwis_status.json") { if (Test-Path $f) { Write-Host "----- $f"; Get-Content $f } } }
          function Wait-Loaded([int]$secs) {
            $st = "$data/serwis_status.json"; Remove-Item $st -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList "--serwis" -PassThru
            $state = ""
            for ($i = 0; $i -lt $secs; $i++) {
              Start-Sleep -Seconds 1
              if (Test-Path $st) { try { $state = (Get-Content $st -Raw | ConvertFrom-Json).state } catch {} }
              if ($state -eq "loaded" -or $state -eq "error" -or $p.HasExited) { break }
            }
            Write-Host "Stan okna: '$state' po $i s, zakończony=$($p.HasExited) kod=$(if ($p.HasExited) { $p.ExitCode })"
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            return $state
          }
          # 0) jak u użytkownika: paczka pobrana z internetu i rozpakowana w Eksploratorze –
          #    wszystkie pliki dostają znacznik Zone.Identifier (ZoneId=3, „Internet”)
          $tagged = 0
          Get-ChildItem -Recurse -File pkg/IntegraCRM | Where-Object { $_.Name -ne "IntegraCRM.exe" } | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://github.com/"
            $tagged++
          }
          Write-Host "Oznaczono jako pobrane z internetu: $tagged plików"
          # kontrola: bez odblokowania błąd musi wystąpić (to ten sam błąd co u użytkownika)
          $env:INTEGRA_NO_UNBLOCK = "1"
          $state = Wait-Loaded 40
          $env:INTEGRA_NO_UNBLOCK = $null
          $err = ""; if (Test-Path "$data/serwis_status.json") { $err = (Get-Content "$data/serwis_status.json" -Raw | ConvertFrom-Json).error }
          Write-Host "Bez odblokowania: stan '$state', błąd: $err"
          if ($state -ne "error" -or $err -notmatch "Python.Runtime") { throw "Nie odtworzono błędu użytkownika – test nie sprawdza poprawki" }
          # tak jak w programie: główne okno odblokowuje pliki, dopiero potem startuje okno panelu
          $u = Start-Process -FilePath $exe -ArgumentList "--unblock" -PassThru; $u.WaitForExit(60000) | Out-Null
          $left = (Get-ChildItem -Recurse -File pkg/IntegraCRM/_internal/pythonnet, pkg/IntegraCRM/_internal/clr_loader, pkg/IntegraCRM/_internal/webview | Where-Object { Get-Item $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue } | Where-Object { $_.Extension -in ".dll", ".exe" }).Count
          Write-Host "Po odblokowaniu zostało oznaczonych bibliotek: $left"
          $env:INTEGRA_NO_UNBLOCK = "1"
          $state = Wait-Loaded 60
          $env:INTEGRA_NO_UNBLOCK = $null
          Write-Host "Po odblokowaniu przez program: stan '$state'"
          if ($state -ne "loaded") { Show-Logs; throw "Po odblokowaniu okno nadal się nie wczytuje (stan: '$state')" }
          # 1) zwykłe uruchomienie – tak jak z przycisku w programie; 3 razy pod rząd (stabilność)
          $env:PYWEBVIEW_LOG = "debug"
          foreach ($k in 1,2,3) {
            $state = Wait-Loaded 60
            if ($state -ne "loaded") { Show-Logs; throw "Zwykłe uruchomienie okna ($k/3) nie doszło do wczytania panelu (stan: '$state')" }
          }
          $env:PYWEBVIEW_LOG = $null
          # 2) test działania + trwałość danych (dwa uruchomienia)
          foreach ($n in 1,2) {
            $env:INTEGRA_SERWIS_TEST = "$PWD\serwis_test_$n.json"
            if ($n -eq 2) { $env:INTEGRA_SHOT = (Resolve-Path shots).Path }
            $p = Start-Process -FilePath $exe -ArgumentList "--serwis" -PassThru
            $done = $p.WaitForExit(120000)
            if (-not $done) { Stop-Process -Id $p.Id -Force }
            $env:INTEGRA_SHOT = $null
            $env:INTEGRA_SERWIS_TEST = $null
            if (Test-Path "serwis_test_$n.json") { Get-Content "serwis_test_$n.json" } else { Show-Logs; throw "Test okna ($n): brak wyniku (zakończony=$done)" }
            $r = Get-Content "serwis_test_$n.json" -Raw | ConvertFrom-Json
            if (-not $r.ok) { Show-Logs; throw "Test okna SERWIS QR nie przeszedł ($n)" }
          }
          $r1 = Get-Content serwis_test_1.json -Raw | ConvertFrom-Json
          $r2 = Get-Content serwis_test_2.json -Raw | ConvertFrom-Json
          if ($r2.cars_before -lt $r1.cars_after) { throw "Dane panelu nie przetrwały ponownego uruchomienia" }
          Remove-Item -Recurse -Force "$data/serwis_webview", "$data/serwis_config.js", "$data/serwis_status.json", "$data/serwis.log" -ErrorAction SilentlyContinue

      - name: Zrzuty ekranu (kontrola wyglądu)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:INTEGRA_SHOT = (Resolve-Path shots).Path
          $p = Start-Process -FilePath pkg/IntegraCRM/IntegraCRM.exe -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Host "timeout" }
          Get-ChildItem shots
          if (Test-Path shots/error.txt) { Get-Content shots/error.txt }
          if (Test-Path shots/dnd.txt) { Get-Content shots/dnd.txt }
          $log = "pkg/IntegraCRM/data/error.log"; if (Test-Path $log) { Get-Content $log }

      - name: Kontrola – panel SERWIS QR osadzony w zakładce programu
        shell: pwsh
        run: |
          if (-not (Test-Path shots/serwis_embed.txt)) { throw "Brak wyniku osadzania panelu" }
          Get-Content shots/serwis_embed.txt
          if (-not (Select-String -Path shots/serwis_embed.txt -Pattern "embedded=True" -Quiet)) {
            $log = "pkg/IntegraCRM/data/serwis.log"; if (Test-Path $log) { Get-Content $log }
            throw "Panel nie został osadzony w zakładce programu"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: zrzuty
          path: shots/*

      - uses: actions/upload-artifact@v4
        with:
          name: IntegraCRM-${{ steps.ver.outputs.version }}
          path: |
            IntegraCRM-*-exe.zip
            integra-*.zip
            version.json

      - name: Wydanie (Releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          if ("${{ github.ref_name }}" -eq "beta") {
            # Kanał beta: stały tag "kanal-beta", oznaczony jako pre-release – NIE jest "latest",
            # więc zwykłe instalacje (releases/latest/...) go nie widzą.
            gh release view kanal-beta 2>$null
            if ($LASTEXITCODE -eq 0) {
              gh release upload kanal-beta "IntegraCRM-$v-exe.zip" "integra-$v.zip" version.json --clobber
              gh release edit kanal-beta --prerelease --title "IntegraCRM BETA $v" --notes "Kanał testowy. Źródło aktualizacji: https://github.com/${{ github.repository }}/releases/download/kanal-beta/version.json"
            } else {
              gh release create kanal-beta "IntegraCRM-$v-exe.zip" "integra-$v.zip" version.json --target beta --prerelease --latest=false --title "IntegraCRM BETA $v" --notes "Kanał testowy. Źródło aktualizacji: https://github.com/${{ github.repository }}/releases/download/kanal-beta/version.json"
            }
            exit 0
          }
          gh release view "v$v" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" "IntegraCRM-$v-exe.zip" "integra-$v.zip" version.json --clobber
          } else {
            gh release create "v$v" "IntegraCRM-$v-exe.zip" "integra-$v.zip" version.json --title "IntegraCRM $v" --notes "Automatyczna kompilacja wersji $v"
          }

      - name: Strona SERWIS QR (GitHub Pages) – budowana z app/serwis
        shell: pwsh
        run: |
          # jedno źródło: panel z programu → gałąź gh-pages (strona dla klientów z kodów QR)
          git fetch --depth 1 origin gh-pages
          git worktree add pages_out FETCH_HEAD
          python tools/build_pages.py pages_out
          Set-Location pages_out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Strona bez zmian"; exit 0 }
          git commit -m "Strona SERWIS QR z wersji ${{ steps.ver.outputs.version }}"
          git push origin HEAD:gh-pages
